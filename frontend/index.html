<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBIT Assistant</title><style>body{font:16px system-ui;max-width:800px;margin:40px auto;padding:0 20px}input,button,textarea{font:inherit;padding:10px}textarea{width:95%}#out{white-space:pre-wrap;background:#f1f5f9;padding:18px;border-radius:10px}img{max-height:140px}a{overflow-wrap:anywhere}</style></head><body><h1>CBIT Assistant — Developer UI</h1><p>Use the API docs at <a href="http://localhost:8000/docs">localhost:8000/docs</a> for full testing.</p><p><label>Bearer token (optional): <input id="token" type="password" size="55"></label></p><textarea id="q" rows="3" placeholder="Ask about a CBIT document, faculty, or your current class"></textarea><p><button id="send">Ask</button></p><div id="out" role="status"></div><div id="cards"></div><script>const el=id=>document.getElementById(id);el('send').onclick=async()=>{el('out').textContent='Searching...';el('cards').replaceChildren();try{const headers={'Content-Type':'application/json'};if(el('token').value)headers.Authorization='Bearer '+el('token').value;const r=await fetch('http://localhost:8000/api/v1/chat',{method:'POST',headers,body:JSON.stringify({question:el('q').value})});const data=await r.json();el('out').textContent=data.answer||JSON.stringify(data);for(const source of (data.sources||[])){const a=document.createElement('a');a.href=source;a.textContent=source;a.target='_blank';a.rel='noopener noreferrer';el('cards').append(a,document.createElement('br'))}if(Array.isArray(data.data))for(const p of data.data){const div=document.createElement('div');div.textContent=p.name+' — '+p.designation+' ('+p.department+')';el('cards').append(div);if(p.image_url && new URL(p.image_url).protocol==='https:'){const img=document.createElement('img');img.src=p.image_url;img.alt=p.name;el('cards').append(img)}}else if(data.data){const pre=document.createElement('pre');pre.textContent=JSON.stringify(data.data,null,2);el('cards').append(pre)}}catch(e){el('out').textContent=String(e)}};</script></body></html>
